<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>房貸利率比較暨月付金試算</title>
<style>
:root{--n:#173b62;--b:#2865a0;--line:#dce5ef;--bg:#f4f7fb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#1e293b;font-family:Arial,"Noto Sans TC",sans-serif;line-height:1.55}header{background:linear-gradient(120deg,#15395e,#2869a2);color:white;padding:28px 18px}.wrap{max-width:1120px;margin:auto;padding:0 16px}h1{margin:5px 0;font-size:clamp(24px,4vw,36px)}header p{margin:0;color:#dbe8f5}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px auto}.panel{background:white;border:1px solid var(--line);border-radius:14px;overflow:hidden}.head{padding:15px 18px;border-bottom:1px solid var(--line);color:var(--n);font-weight:bold}.body,.result{padding:18px}.field{margin-bottom:13px}label{display:block;font-size:13px;font-weight:bold;margin-bottom:6px}input,select{width:100%;height:42px;border:1px solid #cbd5e1;border-radius:8px;padding:0 10px;font-size:15px;background:white}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choices label{display:flex;align-items:center;gap:4px;border:1px solid #cbd5e1;border-radius:8px;padding:7px 9px}.choices input{width:auto;height:auto}.btn{background:var(--b);color:white;border:0;border-radius:8px;padding:11px 15px;font-weight:bold;cursor:pointer}.full{width:100%}.muted{font-size:11px;color:var(--muted)}.hero{background:#edf5fc;border:1px solid #d9e7f4;border-radius:10px;padding:15px;margin-bottom:12px}.big{font-size:30px;font-weight:800;color:var(--n)}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{border:1px solid var(--line);border-radius:9px;padding:11px}.metric b{display:block;font-size:18px}.banklist{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-height:260px;overflow:auto}.bankitem{display:flex;gap:7px;border:1px solid var(--line);border-radius:8px;padding:8px;font-size:12px}.bankitem input{width:15px;height:15px;flex:none}.bankitem small{display:block;color:var(--muted)}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.controls select{width:auto}.tablewrap{overflow:auto}table{width:100%;min-width:600px;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:10px;border-bottom:1px solid var(--line)}th{background:#f3f6fa;color:#526579;font-size:11px}.best{color:#16835d;font-weight:bold}.source{display:flex;gap:12px;align-items:center;padding:12px;background:white;border:1px solid var(--line);border-radius:10px}.source img{width:60px;height:65px;object-fit:cover;object-position:top}.source strong{display:block;color:var(--n);font-size:13px}.footer{text-align:center;color:#8391a3;font-size:11px;padding:18px}@media(max-width:760px){.layout{grid-template-columns:1fr}.banklist{grid-template-columns:repeat(2,1fr)}}@media(max-width:430px){.banklist{grid-template-columns:1fr}.body,.result{padding:14px}}
</style></head><body><header><div class="wrap"><div class="muted" style="color:#c9dbee">MORTGAGE RATE & PAYMENT CALCULATOR</div><h1>房貸利率比較暨月付金試算</h1><p>選擇銀行與貸款條件，快速掌握每月還款金額</p></div></header><main class="wrap">
<div class="layout"><section class="panel"><div class="head">STEP 01｜輸入貸款條件</div><div class="body">
<div class="field"><label>選擇銀行</label><select id="bank"></select></div>
<div class="field"><label>貸款方案</label><div class="choices"><label><input type="radio" name="scheme" value="first" checked>首購</label><label><input type="radio" name="scheme" value="youth">青年安心成家</label><label><input type="radio" name="scheme" value="second">第二戶</label></div><div class="muted" id="hint"></div></div>
<div class="two"><div class="field"><label>年利率（%）</label><input id="rate" type="number" min="0" max="30" step=".001" value="2.55"></div><div class="field"><label>貸款金額（萬元）</label><input id="amount" type="number" min="1" value="1000"></div></div>
<div class="two"><div class="field"><label>貸款年限</label><div class="choices"><label><input type="radio" name="years" value="20">20年</label><label><input type="radio" name="years" value="30" checked>30年</label><label><input type="radio" name="years" value="40">40年</label></div></div><div class="field"><label>寬限期</label><select id="grace"><option value="0">無</option><option value="1">1年</option><option value="2">2年</option><option value="3">3年</option><option value="4">4年</option><option value="5">5年</option></select></div></div>
<button class="btn full" id="calc">計算每月還款金額</button><p class="muted">「起」為起始利率，非保證核貸利率；可自行調整。</p></div></section>
<section class="panel"><div class="head">RESULT｜每月還款試算</div><div id="result" class="result muted">輸入條件後按下計算。</div></section></div>
<section class="panel"><div class="head">STEP 02｜多銀行月付金比較</div><div class="body"><p class="muted">勾選銀行，以相同貸款條件比較月付金。</p><div class="controls"><select id="filter"><option>全部銀行</option><option>官股銀行</option><option>民營銀行</option></select><button class="btn" id="compare">比較勾選銀行</button><button class="btn" id="all" style="background:#eaf1f8;color:#173b62">全選</button></div><div id="banks" class="banklist"></div><div id="table" style="margin-top:14px"></div></div></section>
<div class="source" style="margin-top:18px"><img src="public/bank-rates-original.jpg" alt="原始銀行利率圖片"><div><strong>利率資料：使用者提供之銀行利率圖片</strong><span class="muted">圖片標示製表日期為民國115年11月。排撥、VIP、區域限制及實際核貸利率，請以銀行最新資訊為準。</span></div></div><div class="footer">未計入開辦費、帳管費、設定費、保險等成本。試算僅供參考，實際金額以銀行契約為準。</div></main>
<script>
const BANKS=[["台灣銀行", "官股銀行", 1.775, 2.55, 3.055], ["第一銀行（排撥）", "官股銀行", 1.775, 2.6, null], ["中小企銀", "官股銀行", 1.775, 2.7, null], ["彰化銀行", "官股銀行", 1.775, 2.6, 3.0], ["華南銀行", "官股銀行", 1.775, 2.55, 3.33], ["合作金庫（排撥）", "官股銀行", 1.775, 2.5, null], ["兆豐銀行", "官股銀行", 1.775, 2.6, 3.0], ["土地銀行", "官股銀行", 1.775, 3.3, 3.405], ["渣打銀行（VIP・排撥）", "民營銀行", null, 2.55, 3.0], ["台新銀行", "民營銀行", null, 3.0, 3.25], ["新光銀行", "民營銀行", null, 2.8, 2.8], ["凱基銀行", "民營銀行", null, null, null], ["中國信託（排撥）", "民營銀行", null, 2.9, 3.1], ["匯豐銀行", "民營銀行", null, 2.7, 2.8], ["台北富邦（排撥）", "民營銀行", null, 2.75, 2.95], ["玉山銀行", "民營銀行", null, 2.93, 3.01], ["元大銀行（排撥）", "民營銀行", null, 2.88, 3.2], ["花旗二信", "民營銀行", null, 2.69, 3.0], ["遠東銀行（排撥）", "民營銀行", null, 2.95, 3.1], ["永豐銀行（排撥）", "民營銀行", null, 2.62, null], ["星展銀行", "民營銀行", null, 2.8, 2.8], ["太平農會", "民營銀行", null, 2.65, 2.975], ["潭子農會（限潭子區）", "民營銀行", null, 2.725, 2.825], ["北區、北屯農會", "民營銀行", null, 2.75, null], ["大里農會", "民營銀行", null, 2.75, 2.98], ["國泰世華（VIP・排撥）", "民營銀行", null, 2.7, 4.0], ["聯邦銀行（排撥）", "民營銀行", null, 3.0, 3.0], ["台中二信（排撥）", "民營銀行", null, 2.6, 2.85], ["台中商銀（排撥）", "民營銀行", null, 3.8, 3.8], ["三信商銀", "民營銀行", null, 2.73, 2.98], ["上海銀行", "民營銀行", null, 2.68, 2.88], ["陽信銀行（排撥）", "民營銀行", null, 3.0, 3.0], ["國泰人壽", "民營銀行", null, 2.45, 3.9], ["富邦人壽", "民營銀行", null, 3.2, 3.2], ["新光人壽", "民營銀行", null, 2.5, 2.6]], $=id=>document.getElementById(id), money=n=>Math.round(n).toLocaleString('zh-TW');
const rt=n=>n==null?'未提供':Number(n).toFixed(3).replace(/0+$/,'').replace(/\.$/,'')+'%';
const scheme=()=>document.querySelector('[name=scheme]:checked').value, br=b=>scheme()==='youth'?b[2]:scheme()==='second'?b[4]:b[3];
function sync(){let b=BANKS[+$('bank').value],r=br(b);$('rate').value=r??'';$('hint').textContent=r==null?'此銀行未提供此方案利率，請洽銀行後自行輸入。':'已帶入表列利率 '+rt(r)+'，可自行修改。'}
function pay(p,r,n){let m=r/1200;if(m===0)return p/n;let f=Math.pow(1+m,n);return p*m*f/(f-1)}
function get(){let p=+$('amount').value*10000,r=+$('rate').value,y=+$('amount').dataset.years||+document.querySelector('[name=years]:checked').value,g=+$('grace').value;if(!(p>0)||!Number.isFinite(r)||r<0||r>30||g>=y)throw Error('請確認金額、利率，且寬限期必須短於貸款年限。');return{p,r,y,g}}
function calc(){try{let x=get(),gm=x.g*12,n=x.y*12,io=x.p*x.r/1200,m=pay(x.p,x.r,n-gm),interest=io*gm+m*(n-gm)-x.p;$('result').innerHTML=`<div class="hero"><div class="muted">${gm?'寬限期內每月僅繳利息':'每月本息平均攤還'}</div><div class="big">$${money(gm?io:m)}</div><div class="muted">${gm?'前 '+x.g+' 年':'全期'}月付金</div></div><div class="metrics"><div class="metric"><span class="muted">寬限期後月付本息</span><b>$${money(m)}</b></div><div class="metric"><span class="muted">預估總利息</span><b>$${money(interest)}</b></div><div class="metric"><span class="muted">貸款本金</span><b>$${money(x.p)}</b></div><div class="metric"><span class="muted">總期數</span><b>${n}期</b></div></div><p class="muted">假設全期利率固定、按月計息；寬限期內只付利息，期滿後以剩餘期數本息平均攤還。</p>`}catch(e){$('result').textContent=e.message}}
function list(){let f=$('filter').value;$('banks').innerHTML=BANKS.map((b,i)=>({b,i})).filter(o=>f==='全部銀行'||o.b[1]===f).map(({b,i})=>`<label class="bankitem"><input type="checkbox" class="bc" value="${i}" ${i===0?'checked':''}><span>${b[0]}<small>${b[1]}・首購 ${rt(b[3])}・第二戶 ${rt(b[4])}</small></span></label>`).join('')}
function compare(){try{let x=get(),gm=x.g*12,n=x.y*12,rows=[...document.querySelectorAll('.bc:checked')].map(c=>BANKS[+c.value]).filter(b=>br(b)!=null).map(b=>{let r=br(b),io=x.p*r/1200,m=pay(x.p,r,n-gm),it=io*gm+m*(n-gm)-x.p;return{b,r,io,m,it}}).sort((a,b)=>a.m-b.m);if(!rows.length)throw Error('請至少選擇一家有提供此方案利率的銀行。');let min=rows[0].m;$('table').innerHTML=`<div class="tablewrap"><table><thead><tr><th>銀行</th><th>年利率</th><th>寬限期月付</th><th>寬限期後月付</th><th>預估總利息</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td>${r.b[0]} ${i===0?'<span class="best">最低</span>':''}</td><td>${rt(r.r)}</td><td>$${money(x.g?r.io:r.m)}</td><td class="${r.m===min?'best':''}">$${money(r.m)}</td><td>$${money(r.it)}</td></tr>`).join('')}</tbody></table></div><p class="muted">未提供該方案利率者不列入比較。各銀行承作條件及起始利率請另行確認。</p>`}catch(e){$('table').textContent=e.message}}
$('bank').innerHTML=BANKS.map((b,i)=>`<option value="${i}">${b[0]}｜${b[1]}</option>`).join('');list();sync();$('bank').onchange=sync;document.querySelectorAll('[name=scheme]').forEach(e=>e.onchange=sync);$('calc').onclick=calc;$('compare').onclick=compare;$('filter').onchange=list;$('all').onclick=()=>document.querySelectorAll('.bc').forEach(c=>c.checked=true);
</script></body></html>
